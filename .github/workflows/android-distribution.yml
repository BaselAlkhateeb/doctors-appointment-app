name: Android Fastlane Firebase Workflow

on:
  push:
    branches:
      - development

jobs:
  distribute_to_firebase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.3"
          bundler-cache: false   # نوقف auto cache مؤقتًا
          working-directory: android

      - name: Add Linux platform to bundle
        run: |
          cd android
          bundle lock --add-platform x86_64-linux
          bundle install --path vendor/bundle

      - name: Build & Distribute
        working-directory: android
        env:
          FIRBASE_CLI_TOKEN: ${{ secrets.FIRBASE_CLI_TOKEN }}
        run: bundle exec fastlane android firebase_release